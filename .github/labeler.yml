"📱 Android":
  - changed-files:
      - any-glob-to-any-file: "app/**"

"🧹 chore":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - "*.gradle"
          - "*.gradle.kts"
          - "gradle/**"
          - "gradlew"
          - "gradlew.bat"
          - "scripts/**"
          - ".githooks/**"

"📃 docs":
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - ".codex/**"
          - "AGENTS.md"

"✅ test":
  - changed-files:
      - any-glob-to-any-file:
          - "app/src/test/**"
          - "app/src/androidTest/**"
